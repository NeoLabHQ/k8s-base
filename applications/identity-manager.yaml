apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # For additional fields see https://argoproj.github.io/argo-cd/operator-manual/application.yaml
  project: default
  source:
    repoURL: https://github.com/OMNIGRAM-TEAM/identity-manager.git # also https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: manifests/overlays/production/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: # reference https://argoproj.github.io/argo-cd/user-guide/auto_sync/
    automated:
      prune: true
      selfHeal: true